name: Documentation validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required project documents
        run: |
          test -s README.md
          test -s docs/product/PRD.md
          test -s docs/requirements/REQUIREMENTS.md
          test -s docs/requirements/SRS.md
          test -s docs/agile/BACKLOG.md
          test -s docs/agile/SPRINT-00.md
          test -s docs/quality/TEST-PLAN.md
          echo "Required docs present"
