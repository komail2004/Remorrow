name: Remorrow
options:
  bundleIdPrefix: com.komail
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Remorrow:
    type: application
    platform: iOS
    sources:
      - path: Remorrow/Sources
      - path: Remorrow/Resources
    dependencies:
      - target: RemorrowShareExtension
        embed: true
      - target: RemorrowTextAction
        embed: true
      - target: RemorrowWidget
        embed: true
    entitlements:
      path: Remorrow/Remorrow.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.komail.Remorrow
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Remorrow
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "With your permission, Remorrow checks calendar availability and creates or moves events only after you approve."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Remorrow saves reminders only after you review and approve them."
        INFOPLIST_KEY_NSCameraUsageDescription: "Photograph notes, receipts, or renewal notices you choose to review locally."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Choose a screenshot, receipt, or renewal notice for private on-device reading. Remorrow does not scan your library."
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
  RemorrowShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: RemorrowShareExtension
        excludes:
          - Info.plist
          - RemorrowShareExtension.entitlements
    entitlements:
      path: RemorrowShareExtension/RemorrowShareExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.komail.Remorrow.ShareExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RemorrowShareExtension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
  RemorrowTextAction:
    type: app-extension
    platform: iOS
    sources:
      - path: RemorrowTextAction
        excludes:
          - Info.plist
          - RemorrowTextAction.entitlements
    entitlements:
      path: RemorrowTextAction/RemorrowTextAction.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.komail.Remorrow.TextAction
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RemorrowTextAction/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
  RemorrowWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: RemorrowWidget
        excludes:
          - Info.plist
          - RemorrowWidget.entitlements
    entitlements:
      path: RemorrowWidget/RemorrowWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.komail.Remorrow.Widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RemorrowWidget/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
  RemorrowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Remorrow/Tests
    dependencies:
      - target: Remorrow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.komail.RemorrowTests
  RemorrowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Remorrow/UITests
    dependencies:
      - target: Remorrow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.komail.RemorrowUITests
schemes:
  Remorrow:
    build:
      targets:
        Remorrow: all
        RemorrowTests: [test]
    test:
      targets:
        - RemorrowTests
        - RemorrowUITests
