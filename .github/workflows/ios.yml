name: iOS build and unit tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          xcodebuild -project Remorrow.xcodeproj -scheme Remorrow -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run unit tests
        run: |
          xcodebuild -project Remorrow.xcodeproj -scheme Remorrow -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO test
