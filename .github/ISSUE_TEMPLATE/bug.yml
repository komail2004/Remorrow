name: Bug report
description: Report a defect in Remorrow
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Never paste private messages or receipts.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected versus actual
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and iOS version
