name: Remorrow
options:
  bundleIdPrefix: com.komail
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Remorrow:
    type: application
    platform: iOS
    sources:
      - path: Remorrow/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.komail.Remorrow
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Remorrow
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Remorrow saves calendar events only after you review and approve them."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Remorrow saves reminders only after you review and approve them."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Choose screenshots you want Remorrow to read. Remorrow never scans your photo library."
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
  RemorrowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Remorrow/Tests
    dependencies:
      - target: Remorrow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.komail.RemorrowTests
schemes:
  Remorrow:
    build:
      targets:
        Remorrow: all
        RemorrowTests: [test]
    test:
      targets:
        - RemorrowTests
